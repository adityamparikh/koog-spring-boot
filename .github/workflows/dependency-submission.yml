# Most coordinates in gradle/libs.versions.toml carry no version (the Spring Boot and OTel BOMs
# manage them), so GitHub's static parser cannot see them. This job resolves the real Gradle
# dependency graph and submits it, so Dependabot alerts cover every resolved library.
name: Dependency submission

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # required by the dependency-submission API

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
