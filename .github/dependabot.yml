# Weekly update PRs for Gradle dependencies (version catalog + plugins) and the pinned GitHub
# Actions SHAs. Each PR still has to pass CI (./gradlew build) before it can merge.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns: ["org.springframework.boot*", "io.spring.dependency-management*"]
      koog:
        patterns: ["ai.koog*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
